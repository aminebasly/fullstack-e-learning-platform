<div class="page-container">
  <app-header></app-header>

  <div class="quiz-form-container">
    <h2 class="title">📝 Create {{ quizType }} Quiz</h2>

    <div class="form-group">
      <label for="quizType">Quiz Type</label>
      <select id="quizType" [(ngModel)]="quizType" class="form-control">
        <option value="PLACEMENT">PLACEMENT</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
      </select>
    </div>

    <hr>

    <div class="question-card">
      <h4>Add New Question</h4>

      <div class="form-group">
        <label for="questionText">Question Text</label>
        <textarea id="questionText" [(ngModel)]="newQuestion.text" class="form-control" rows="2" placeholder="Enter the question..."></textarea>
      </div>

      <div class="form-group">
        <label for="questionType">Question Type</label>
        <select id="questionType" [(ngModel)]="newQuestion.type" class="form-control">
          <option value="MULTIPLE_CHOICE">Multiple Choice</option>
          <option value="TRUE_FALSE">True/False</option>
        </select>
      </div>

      <div *ngIf="newQuestion.type === 'MULTIPLE_CHOICE'" class="form-group">
        <label>Options</label>
        <div *ngFor="let opt of newQuestion.options; let i = index; trackBy: trackByIndex" class="option-row">
          <input [(ngModel)]="newQuestion.options[i]" class="form-control" placeholder="Option {{ i + 1 }}" />
        </div>

        <label>Correct Option (1-4)</label>
        <input type="number" [(ngModel)]="newQuestion.correctOption" min="1" max="4" class="form-control" />
      </div>

      <div *ngIf="newQuestion.type === 'TRUE_FALSE'" class="form-group">
        <label>Correct Answer</label>
        <select [(ngModel)]="newQuestion.correctOption" class="form-control">
          <option [value]="0">False</option>
          <option [value]="1">True</option>
        </select>
        <div class="hint">You don't need options for True/False questions.</div>
      </div>

      <button (click)="addQuestion()" class="btn btn-add">➕ Add Question</button>
    </div>

    <hr>

    <div *ngIf="questions.length > 0" class="preview-section">
      <h3>🧾 Pending Questions ({{ questions.length }})</h3>
      <ul>
        <li *ngFor="let q of questions; let i = index">
          <div class="question-item">
            <div>
              <strong>Q:</strong> {{ q.text }}<br />
              <small>Type: {{ q.type }} | Correct Option: {{ q.correctOption }}</small>
            </div>
            <button class="btn btn-delete" (click)="removeQuestion(i)">🗑️</button>
          </div>
        </li>
      </ul>

      <button (click)="submitAll()" class="btn btn-submit">✅ Submit All</button>
    </div>
  </div>

  <app-footer></app-footer>
</div>
