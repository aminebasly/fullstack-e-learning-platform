<div class="wrapper">
    <div class="container">
      <!-- Logo and Name in Top-Left -->
      <div class="header">
        <img src="/assets/img/English-Star.jpg" alt="English Star Logo" class="logo">
        <span class="brand-name">English Star</span>
      </div>
  
      <!-- Reset Password Form or Success Message -->
      <div class="login-form">
        <div *ngIf="!isSubmitted">
          <h2 class="textual">Reset Password</h2>
          <form #resetForm="ngForm" (ngSubmit)="onSubmit()">
            <small class="text-danger"><b>{{ errorMessage }}</b></small>
            <div class="form-group">
                <label for="newPassword">New Password: <b class="text-danger">*</b></label>
                <input type="password" class="form-control" placeholder="Enter new password" name="newPassword" [(ngModel)]="newPassword" required #newPasswordField="ngModel" [class.is-invalid]="newPasswordField.invalid && newPasswordField.touched">
                <div *ngIf="newPasswordField.errors && newPasswordField.invalid && newPasswordField.touched">
                    <small class="text-danger" *ngIf="newPasswordField.errors.required"><b>Required field</b></small>
                </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password: <b class="text-danger">*</b></label>
              <input type="password" class="form-control" placeholder="Confirm new password" name="confirmPassword" [(ngModel)]="confirmPassword" required #confirmPasswordField="ngModel" [class.is-invalid]="confirmPasswordField.invalid && confirmPasswordField.touched || (newPassword !== confirmPassword && confirmPasswordField.touched)">
              <div *ngIf="confirmPasswordField.errors && confirmPasswordField.invalid && confirmPasswordField.touched">
                <small class="text-danger" *ngIf="confirmPasswordField.errors.required"><b>Required field</b></small>
              </div>
              <div *ngIf="newPassword !== confirmPassword && confirmPasswordField.touched">
                <small class="text-danger"><b>Passwords do not match</b></small>
              </div>
            </div>
            <button [disabled]="resetForm.form.invalid || newPassword !== confirmPassword" type="submit" class="btn loginbtn">Reset Password</button>
          </form>
          <div class="options">
            <a [routerLink]="['/login']" class="forgot-link">Back to Login</a>
          </div>
        </div>
  
        <!-- Success Message -->
        <div *ngIf="isSubmitted">
          <h2 class="textual">Success</h2>
          <p class="text-center">{{ message }}</p>
          <div class="options">
            <a [routerLink]="['/login']" class="forgot-link">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
