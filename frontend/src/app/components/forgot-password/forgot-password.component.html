<div class="wrapper">
    <div class="container">
      <!-- Logo and Name in Top-Left -->
      <div class="header">
        <img src="/assets/img/English-Star.jpg" alt="English Star Logo" class="logo">
        <span class="brand-name">English Star</span>
      </div>
  
      <!-- Forgot Password Form or Success Message -->
      <div class="login-form">
        <div *ngIf="!isSubmitted">
          <h2 class="textual">Forgot Password</h2>
          <form (ngSubmit)="onSubmit()">
            <small class="text-danger"><b>{{ message }}</b></small>
            <div class="form-group">
              <label for="email">Email Address: <b class="text-danger">*</b></label>
              <input type="email" class="form-control" placeholder="Enter your email" name="email" [(ngModel)]="email" required pattern="^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9.-]+$" #emailInput="ngModel" [class.is-invalid]="emailInput.invalid && emailInput.touched">
              <div *ngIf="emailInput.errors && emailInput.invalid && emailInput.touched">
                <small class="text-danger" *ngIf="emailInput.errors.required"><b>Required field</b></small>
                <small class="text-danger" *ngIf="emailInput.errors.pattern"><b>Invalid email</b></small>
              </div>
            </div>
            <button [disabled]="!email" type="submit" class="btn loginbtn">Submit</button>
          </form>
          <div class="options">
            <a [routerLink]="['/login']" class="forgot-link">Back to Login</a>
          </div>
        </div>
  
        <!-- Success Message -->
        <div *ngIf="isSubmitted">
          <h2 class="textual">Check Your Email</h2>
          <p class="text-center">{{ message }}</p>
          <div class="options">
            <a [routerLink]="['/login']" class="forgot-link">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
